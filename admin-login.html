<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlexaGo Admin Sign In</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="admin-login-page">

<div class="admin-login-container">
  <img class="admin-login-logo" src="img/flexago-logo-new.png" alt="FlexaGo">
  <h2>Admin sign in</h2>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button id="send-2fa-btn">Send 2FA Code</button>

  <div id="twofa-section" style="display:none;">
    <input id="twofa-code" type="text" placeholder="Enter 2FA Code">
    <button id="login-btn">Login</button>
  </div>

  <p id="status"></p>
</div>

<script src="admin-login.js"></script>
</body>
</html>
