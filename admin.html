<!DOCTYPE html>
<html>
<head>
  <title>Flexago Admin Dashboard</title>
  <link rel="stylesheet" href="css/admin.css">

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<script>
  // JWT PROTECTION
  const token = localStorage.getItem("adminToken");
  if (!token) {
    window.location.href = "admin-login.html";
  }
</script>

<div class="admin-header">
  <h1>Flexago Admin Dashboard</h1>
  <button id="logoutBtn">Logout</button>
</div>

<div class="admin-nav">
  <button class="tab-btn" data-tab="users">Users</button>
  <button class="tab-btn" data-tab="deliveries">Deliveries</button>
  <button class="tab-btn" data-tab="escrow">Escrow</button>
  <button class="tab-btn" data-tab="payouts">Payouts</button>
  <button class="tab-btn" data-tab="revenue">Revenue</button>
  <button class="tab-btn" data-tab="analytics">Analytics</button>
</div>

<div class="admin-content">

  <!-- USERS TAB -->
  <section id="users" class="tab-section">
    <h2>Users</h2>
    <div id="usersTable"></div>
  </section>

  <!-- DELIVERIES TAB (replaces Orders) -->
  <section id="deliveries" class="tab-section" style="display:none;">
    <h2>Deliveries</h2>
    <div id="deliveriesTable"></div>
  </section>

  <!-- ESCROW TAB -->
  <section id="escrow" class="tab-section" style="display:none;">
    <h2>Escrow</h2>
    <div id="escrowTable"></div>
  </section>

  <!-- PAYOUTS TAB -->
  <section id="payouts" class="tab-section" style="display:none;">
    <h2>Payouts</h2>
    <div id="payoutsTable"></div>
  </section>

  <!-- REVENUE TAB -->
  <section id="revenue" class="tab-section" style="display:none;">
    <h2>Revenue</h2>
    <div id="revenueTable"></div>
  </section>

  <!-- ANALYTICS TAB -->
  <section id="analytics" class="tab-section" style="display:none;">
    <h2>Analytics</h2>

    <div class="chart-container">
      <h3>Deliveries Per Day</h3>
      <canvas id="deliveriesChart"></canvas>
    </div>

    <div class="chart-container">
      <h3>Revenue Per Day</h3>
      <canvas id="revenueChart"></canvas>
    </div>

    <div class="chart-container">
      <h3>User Growth</h3>
      <canvas id="userChart"></canvas>
    </div>

    <div id="analyticsTable"></div>
  </section>

</div>

<!-- DELIVERY DETAILS MODAL (replaces Order modal) -->
<div id="deliveryModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="closeModal" class="close">&times;</span>
    <h2>Delivery Details</h2>
    <div id="deliveryDetails"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
